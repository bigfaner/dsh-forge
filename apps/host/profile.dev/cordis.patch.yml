# dsh-forge dev profile — 产品用户层（与打包形态模板 apps/host/src/profile/template.ts 同源语义）。
# 注意：patch 按 row id 整体替换该行 config（非深合并），保留字段须重述
# （上游 app-boot README：「A user patch replaces the whole matched config」）。

# ── 官方行（按 id 定位 web-app 出厂行：与出厂值一致的 no-op 重述，
#    验证「官方行 + 产品层」的叠放次序——用户层在所有 bundle 层之后）──
- id: system-prompt
  config:
    personaSuffix: Your working directory is {{cwd}}.
    personaPrefix: >-
      You are a coding agent powered by the {{model}} model.

# ── 官方行（置停）：client-hmr 全图 sync 会以宿主最新图对账掉壳掌舵追加的产品 client 行
#    （S2 清单残留 #3；2.7 实证：产品插件激活 ~145ms 后被 prune，槽位注册级联回收）。
#    产品组合静态（随应用发版更新），P1 无 HMR 面——重启/刷新即重掌舵，不需要热替换链。
- id: client-hmr
  disabled: true

# ── 产品插件行（4.2 转正启用——SMOKE-LEDGER §5 转正条件落位）：
#    core = 单 SQLite 句柄双服务（ctx.forgeProjects / ctx.forgeKnowledge）；
#    knowledge = 召回 tool 双件 + forge:knowledge 系统提示词段。
#    config 不在用户层书写（dbFile / bindingsFile 属应用装配期路径——runProfile
#    boot overlay 按 userData 逐启生成，见 apps/host/src/boot/overlay.ts）。
#    dev 形态链 workspace 构建产物（package.json link: 三件）。──
- insert:
    - id: dsh-forge-core
      name: '@dsh-forge/core'
    - id: dsh-forge-knowledge
      name: '@dsh-forge/knowledge'
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      zai-coding-cn:
        apiKeyEnv: ZAI_CODING_CN_API_KEY
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: zai-coding-cn
    model: glm-5.3
    reasoningEffort: max
