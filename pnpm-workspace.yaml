packages:
  - apps/*
  - packages/*
  # packages/plugins/* 为 cordis 插件包居所（首住户 md-mermaid；既有 plugin-forge* 平铺不动）
  - packages/plugins/*
  # lib/* 公共包群（plugin-project 1.2 起步：api/db/diag/util/path 扁平子包，无 kit 壳）
  - lib/*
  # plugins/* 插件统一目录（root 级，与 lib/ 同级；plugin-project 1.3 起步——首住户 project）
  - plugins/*

# Electron 精确 pin 44.0.0（S1 实测指纹门：node-addon-require-builtin 仅接受
# 43.0.0 / 44.0.0 / 45.0.0-alpha.6——升级 Electron = 等上游扩展指纹清单）。
# 本机 pnpm 11 不执行 electron 安装脚本（spike S1 记录），二进制按需补齐：
#   ELECTRON_MIRROR=https://npmmirror.com/mirrors/electron/ \
#     node apps/host/node_modules/electron/install.js   （1.4 启动前执行）
allowBuilds:
  electron: true
  # input-history client bundle 打包器（官方 clientBundle 配方移植——安装脚本仅
  # 平台二进制校验，零原生编译）；mobile 工程构建工具（1.2）：esbuild 安装脚本仅落
  # 平台二进制（@esbuild/win32-x64 可选依赖）
  esbuild: true
  # 1.4 运行时闭包原生包（spike S1 profile 同款 allowBuilds——均带 prebuild，
  # 脚本仅取 prebuild 免 MSVC 编译；S1 实测约束 5）
  '@deepseek-ai/dsh-subprocess-local': true
  '@google/genai': true
  koffi: true
  node-pty: true
  protobufjs: true
  # 2.1 SQLite 引擎（13.0.3 零安装脚本，prebuilds/ 随包分发含 win32-x64——
  # allowBuilds 仅消 pnpm ignored-builds 门，无编译动作）
  better-sqlite3: true
  # 4.1 electron-builder 传递依赖（Squirrel.Windows 目标专用）：P1 仅 NSIS 目标，
  # 构建脚本无需执行——显式置 false 消 ignored-builds 门
  electron-winstaller: false

overrides:
  # 全仓 cordis pin 统一 4.1.0（bug 1103261e：override 滞留 4.0.4 曾致 lock importer 段脱钩 manifest）——
  # override 强制单副本，消除双 cordis 实例类型分裂（apps/host boot/child Context 双版本错位）
  '@deepseek-ai/cordis': 4.1.0
  # cordis 自身 peer 期望 include ~1.0.9 / loader ~1.0.5——统一到同栈版本，
  # 折叠多 cordis 物理实例（include/loader 1.1.0 变体会派生第二个 cordis 副本）
  '@deepseek-ai/cordis-plugin-include': 1.0.9
  '@deepseek-ai/cordis-plugin-loader': 1.0.5
  # 4.1 electron-builder：app-builder-lib 26.17 代码需 ElectronDownloadCacheMode（@electron/get
  # >=3.1 面），其 ^3.0.0 声明被解析到 3.0.0（运行期 resolveCacheMode 崩）——scoped 强制 3.1.0
  'app-builder-lib>@electron/get': 3.1.0

minimumReleaseAgeExclude:
  - vite@8.3.2
