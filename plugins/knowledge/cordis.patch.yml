# @dsh-forge/knowledge 组合层：单行插入本包——host 半 apply 内 provide 服务键
# `knowledge`（host servicesFace 正门）+ knowledge_* 七工具注册 + 系统提示词静态段
# forge:knowledge(910) 插件工厂全局注册（动态段 forge:knowledge-domains(911) 走
# session-bind scoped 缝）；浏览器半应 dsh.client.platform=web 由 modules 行扫描进
# 花名册（./client = 自注册 CJS bundle）。
- insert:
    - id: knowledge
      name: '@dsh-forge/knowledge'
# skills 自持行（forge-aggregate-bundle 1.4——探针④分支 A）：异 id 绕开官方对顶层
# base 行 skill-filesystem 的定点 disable（fefd5149：同 id 即命中、provider 不注册）；
# providerName 显式互异（默认 'filesystem' 同层重名注册 loud-fail）。customSkillDirs
# 自锚本包 skills/，!!js 表达式 && 短路兜底（防锚解析异常冒泡打断行激活）。
- id: skill-filesystem-knowledge
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    providerName: filesystem-knowledge
    customSkillDirs:
      - !!js process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('@dsh-forge/knowledge/package.json') && process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('@dsh-forge/knowledge/package.json')), 'skills')
