# @dsh-forge/expert-squad 组合层：单行插入本包——host 半 apply 内 provide 服务键
# `experts`（ctx.experts 正门）+ tool/fetch 路由族（六条：list/get/update/enable/
# disable/run-state）注册；浏览器半应 dsh.client.platform=web 由 modules 行扫描进
# 花名册（./client = 自注册 CJS bundle）。
#
# 猎头模式预设行（expert-squad 0.30.0 起随包自带——原 apps/host 预设底稿
# headhunter.patch.yml 迁入；形态 = 上游 dsh-web-app standard.patch.yml 镜像裁剪版，
# 工程面行（命令/进程/文件/技能/计划/委派/目标/present）整体移除，行集契约 pin 见
# apps/host presets.test.ts 猎头段；persona prefix = 招聘/管理 SOP）。preset 子树
# 只收宿主全组合可解析可启动的官方件（registry auditRows 挂载审计：子树内任一行
# never started/解析失败 → preset broken → UI !broken 过滤整行缺席——desktop 判例
# 2026-11-22：tool-office 在 desktop 组合 never started 致猎头预设下拉缺席，故
# office 行不入 preset 子树，office 能力由宿主全局行提供）。expert-squad
# 5 管理工具 + delegate_expert 为全局单实例注册，本 patch 零组合级工具声明。
- insert:
    - id: expert-squad
      name: '@dsh-forge/expert-squad'
- insert:
    - id: preset-headhunter
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: headhunter
        name: 猎头模式
        description: "专家团猎头：对话式招聘与管理专家档案（招募/修改/启停/查询），不含委派。"
        order: 3
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              suffix: Your working directory is {{cwd}}.
              prefix: >-
                You are a coding agent powered by the {{model}} model.
                你是专家团猎头（猎头模式）：寻访与管理专家人才的负责人。核心能力是「看人」——把一句模糊的用人需求，澄清成一份可直接差遣的专家档案：键名、岗位头衔、简介、工具装备、人设履历，一次交付即可派发。
                猎头作风：先澄清岗位画像再寻访——问清三件事（要解决什么问题、需要哪些工具装备、档案放用户层还是项目层），需求不明不动笔；list_experts 查重防撞名，有人岗匹配的先给对标建议，市场无人再启动建档；档案落盘后带键名与落点回执，提示用户在专家团面板查看。
                简历官视角：每份专家档案都是一份简历——title 是岗位头衔，description 是一句话卖点，persona 是履历正文，tools 是技能装备；写出来的档案要让用户看简历就能决定是否差遣。
                用人部门对齐：用户是老板，主 agent 是用人部门——猎头向用人部门交付：档案合格与否，由用人部门能否拿去直接差遣说了算；岗位画像以用人部门诉求为准绳，宁可多问一轮，不交付岗位错配的档案。
                边界（猎头只荐不管派）：委派执行是主会话对专家说任务的事，猎头不代派；会话不产出代码、不执行命令、不改仓库文件，档案落盘一律走专家管理工具；不编造履历与能力，不擅自扩写工具白名单。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: tool-plugin-market
            name: '@deepseek-ai/dsh-plugin-market/tools'
            disabled: true
# skills 自持行（forge-aggregate-bundle 1.4——探针④分支 A）：异 id 绕开官方对顶层
# base 行 skill-filesystem 的定点 disable（fefd5149：同 id 即命中、provider 不注册）；
# providerName 显式互异（默认 'filesystem' 同层重名注册 loud-fail）。customSkillDirs
# 自锚本包 skills/，!!js 表达式 && 短路兜底（防锚解析异常冒泡打断行激活）。
- id: skill-filesystem-expert-squad
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    providerName: filesystem-expert-squad
    customSkillDirs:
      - !!js process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('@dsh-forge/expert-squad/package.json') && process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('@dsh-forge/expert-squad/package.json')), 'skills')
