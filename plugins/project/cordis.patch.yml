# @dsh-forge/project 组合层：单行插入本包——host 半 apply 内域装配
# （projects/worktrees/bugs/dirs 服务 provide + 通道族注册）随迁移任务逐批落位；
# 浏览器半经 dsh.client.platform=web 由 modules 行扫描装载（./client = 自注册
# CJS bundle）。
- insert:
    - id: project
      name: '@dsh-forge/project'
# skills 自持行（forge-aggregate-bundle 1.4——探针④分支 A）：异 id 绕开官方对顶层
# base 行 skill-filesystem 的定点 disable（fefd5149：同 id 即命中、provider 不注册）；
# providerName 显式互异（默认 'filesystem' 同层重名注册 loud-fail）。customSkillDirs
# 自锚本包 skills/，!!js 表达式 && 短路兜底（防锚解析异常冒泡打断行激活）。
- id: skill-filesystem-project
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    providerName: filesystem-project
    customSkillDirs:
      - !!js process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('@dsh-forge/project/package.json') && process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('@dsh-forge/project/package.json')), 'skills')
