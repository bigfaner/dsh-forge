# @dsh-forge/forge 单行自插（forge-deep-pack 1.4——单行自插裁定，全通道统一）：
# 五件零插行，一律经 host apply 组合激活（ctx.plugin 官方缝——P0 #1 定谳）。
# - config 行 = { home } 唯一键（forge 统一 schema——db/tasksHome 不设覆写键恒延伸），
#   值由 assembly 派发单源同源物化：home 缺省 = {DSH_HOME}/forge（延伸常量
#   FORGE_HOME_SUFFIX 静态双检锚 tests/forge/derive-configs.test.ts，漂移红）。
# - !!js 表达式官方 userPatchesSchema 方言（entry-list，dsh-app-boot parsePatchList
#   核销）：DSH_HOME 缺席 → home falsy → forge apply 零配置派发，五件回落各自
#   单装缺省装配（fail-soft 不阻载）。
# - patch config 为完整对象：官方 override 语义 = config 整体替换非深合并（dsh-app-boot
#   applyEntryPatches 核销）——卸下 forge 后五件回落单装行与缺省 config，语义不变。
- insert:
    - id: forge
      name: '@dsh-forge/forge'
      config:
        home: !!js process.env.DSH_HOME && (process.env.DSH_HOME + '/forge')
