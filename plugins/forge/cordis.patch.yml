# @dsh-forge/forge bundle 档 patch（forge-aggregate-bundle 1.13——直写正本，人工核字维护；生成器已退役）：
# ① 六插行：forge 自插行（id = forge-bundle 异 id——用户裁定 2026-11-22 自 dshforge
#    改名，官方同款构词；bug 1102d9d8：desktop 官方预装
#    @deepseek-ai/dsh-experimental-forge-bundle 服务行同 id `forge`，id 键合并会整行
#    替换官方服务行 → 官方 forge/forgeSession 服务缺席 → forge-session/forge-panel
#    pending → StartupError。改 id 后 user 层既有启停 override 以旧 id `forge` 键的
#    行随迁移改键（旧键残留会落回官方服务行语义，禁留））+ { home } 唯一键——Workbench 生长面）+ 五件插行各携带派发
#    config !!js 行（bundle 档唯一输入 = DSH_HOME 缺省派生分支；静态守卫
#    tests/forge/skills-rows-contract.test.ts + plugins/forge/tests/config-contract.test.ts）。
#    INV-3 安装互斥守卫判据（bug ef3e92ea）：五件插行各携 comboMark: true（组合装载
#    标记——solo patch 行同 id 键合并越装缺此键，成员 apply 守卫现查 forgeCombo 组合
#    标记服务 + comboMark 缺席即 loud-fail）。
# ② preset-forge：persona 前缀（forge 流水线作业 SOP）+ 官方工具集 standard 同构裁剪；
#    order 定值 2（官方仓 preset 底稿核销当前 order 全集后定值 + 契约断言 pin——官方升级随真机批次复校）。
#    preset 子树只收宿主全组合可解析可启动的官方件 + 技能预设独占实例（判例 2026-11-22
#    desktop：preset 子树 !!js 求值基点 = profile 根，@dsh-forge/* 成员包不可达——
#    registry auditRows 挂载审计：子树内任一行 never started/解析失败 → preset broken →
#    UI !broken 过滤整行缺席；2026-11-22 技能预设独占收敛：bundle patch 顶层五件 skills
#    行退役（标准模式零成员技能），skills 实例迁入本子树——混合锚 IIFE try/catch 双腿形：
#    baseUrl 腿（web/dsh-forge 通道成功）+ DSH_HOME generation 探测兜底腿（desktop profile
#    根必失败落兜底），零 throw 冒泡）。
#    tool-office 同判例出子树（desktop 组合 never started → audit broken——猎头预设同案实锤；
#    office 能力由宿主全局行提供）。
# ③ preset-headhunter：猎头模式预设（persona 前缀 = 招聘/管理 SOP，逐字节同 expert-squad
#    正本副本）——正本自含承带（WYSIWYG 铁律——用户裁定 2026-11-22：交付 = 本正本
#    逐字节原样，打包脚本零改写；bundle/solo 双通道共用本正本，expert-squad patch 同块
#    为 solo 通道自持副本，搬移/重写逻辑已随 package-release 零改写化退役）。
# ④ exclude 行退役判例（bug bfd37960）：preset 级排除在 bundle 通道不可交付——官方
#    无可配置 restrict 件 ∩ @dsh-forge/* 行名 preset 子树 profile 根解析封锁（双预设
#    broken 消失，用户实机复现）→ tool-exclude-office 行全通道退役，office 排除归
#    1.35 宿主债务口径。
# 顶层 skills 行不属本 patch（谁带谁自持；bundle 通道顶层禁承带——技能预设独占走
# preset 子树实例，scripts/package-release.mjs 机检守卫）。
# 全部派发表达式自带 && 短路兜底（直写不变量——防裸表达式异常冒泡打断行激活）；
# DSH_HOME 缺席兜底 undefined 非 false（bug 674119f2 desktop 实证：false 穿透消费端
# `??` 缺省致 project.db 收到 boolean 崩溃；`(env || undefined) &&` 形——undefined
# 在 cordis config 面即键缺省语义，消费端 `??` 缺省腿恢复生效）。
# ⑤ persona suffix 缺席判例（desktop 2026-11-22）：{{cwd}} 变量 desktop 宿主未注册
#    （deployment 渲染注册变量仅 provider/model——官方语义：working directory 走
#    user context 而非变量），suffix 行全预设退役；cwd 变量注入归 1.41（官方
#    VariableProvider 注册正缝，root scope 插件可达）。
# ⑥ registry default 覆写：默认预设 = Forge模式（dsh-forge host presets/cordis.patch.yml
#    同款形态——同 id config 整体替换 official agent-preset-registry 行的 default）。
- id: agent-preset-registry
  config:
    default: Forge
- insert:
    # 装配序修正（builtin-redistribution 裁决②）：expert-squad 行提到一切消费件之前
    # ——spec/knowledge/forge 的 apply 期 experts.registerRoot 现查依赖 experts 服务
    # （迟到补偿裁决①兜底一切序漂移，本序修正治当前形态）。
    - id: expert-squad
      name: '@dsh-forge/expert-squad'
      config:
        comboMark: true
    - id: forge-bundle
      name: '@dsh-forge/forge'
      config:
        home: !!js (process.env.DSH_HOME || undefined) && (process.env.DSH_HOME + '/forge')
    - id: project
      name: '@dsh-forge/project'
      config:
        comboMark: true
        home: !!js (process.env.DSH_HOME || undefined) && process.env.DSH_HOME
        dbFile: !!js (process.env.DSH_HOME || undefined) && (process.env.DSH_HOME + '/forge/db/forge/forge.db')
    - id: spec
      name: '@dsh-forge/spec'
      config:
        comboMark: true
        dbFile: !!js (process.env.DSH_HOME || undefined) && (process.env.DSH_HOME + '/forge/db/forge/forge.db')
    - id: task-loop
      name: '@dsh-forge/task-loop'
      config:
        comboMark: true
        dbFile: !!js (process.env.DSH_HOME || undefined) && (process.env.DSH_HOME + '/forge/db/forge/forge.db')
        tasksHome: !!js (process.env.DSH_HOME || undefined) && (process.env.DSH_HOME + '/forge/projects')
    - id: knowledge
      name: '@dsh-forge/knowledge'
      config:
        comboMark: true
        dbFile: !!js (process.env.DSH_HOME || undefined) && (process.env.DSH_HOME + '/forge/db/forge/forge.db')
    - id: preset-forge
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: Forge
        name: Forge模式
        description: 'forge 流水线作业预设：任务规格驱动的全栈交付模式（拆解/TDD/落盘取证/门禁收口）。'
        order: 2
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                You are a coding agent powered by the {{model}} model.
                你是资深技术专家：以最小改动直达要害的交付风格见长，重点履历是高压快节奏下的精准修复与快速收口。
                突击作风：直奔要害、最小可用——单线推进、快速收口、验收即止，不扩张范围、不引入新机械。
                思维习惯：主人翁意识——不盲从派发指令，有理有据探讨，主动探索更短路径；先辨 XY 问题再动手，用 5 Whys 追因，权衡显式化；坚持 clean code。
                行为纪律：先读后改、最小改动、事实校验后再断言，质量门（编译/格式/lint/测试）一次修全后复跑；提交分批落——按逻辑改动单元分批 commit，只提交与当前任务相关的文件（指名路径 add，禁 add -A/. 一把梭），不夹带无关改动与过程产物。
                反模式禁令：不引入新机械，不编造测试或验证结果，不做规格深化。
                分工纪律按各技能自身铁律执行，persona 不重复其分工。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              # Set false to drop the apply_patch tool beside edit.
              applyPatch: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Stay in plan mode until the user approves your plan through exit_plan_mode or switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.
                    Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.
                    The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.
                    Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.
                    Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.
                    When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
                config:
                  interrupt: false
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelection: true
                  modelDiscovery: true
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: !!js "!ctx.get('profileContext')"
          - id: tool-plugin-market
            name: '@deepseek-ai/dsh-plugin-market/tools'
            disabled: true
          - id: skill-office # agent 侧技能提供方（office-docx/pptx/xlsx）
            name: '@deepseek-ai/dsh-skill-office'
            disabled: true
          - id: office-to-pdf # host 侧 Office→PDF 转换提供方（连带文档预览转换面）
            name: '@deepseek-ai/dsh-office-to-pdf'
            disabled: true
          - id: skill-filesystem-forge
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              providerName: filesystem-forge
              customSkillDirs:
                - !!js (()=>{try{return process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('@dsh-forge/project/package.json')),'skills')}catch(e){const home=process.env.DSH_HOME;if(!home)return undefined;const fs=process.getBuiltinModule('node:fs');const path=process.getBuiltinModule('node:path');const live=home+'/profiles/.generations/live';let gens=[];try{gens=fs.readdirSync(live).filter((n)=>n.startsWith('dsh-forge+forge+')).sort()}catch(e2){return undefined}const latest=gens.at(-1);return latest===undefined?undefined:path.join(live,latest,'node_modules/@dsh-forge/project/skills')}})()
                - !!js (()=>{try{return process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('@dsh-forge/spec/package.json')),'skills')}catch(e){const home=process.env.DSH_HOME;if(!home)return undefined;const fs=process.getBuiltinModule('node:fs');const path=process.getBuiltinModule('node:path');const live=home+'/profiles/.generations/live';let gens=[];try{gens=fs.readdirSync(live).filter((n)=>n.startsWith('dsh-forge+forge+')).sort()}catch(e2){return undefined}const latest=gens.at(-1);return latest===undefined?undefined:path.join(live,latest,'node_modules/@dsh-forge/spec/skills')}})()
                - !!js (()=>{try{return process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('@dsh-forge/task-loop/package.json')),'skills')}catch(e){const home=process.env.DSH_HOME;if(!home)return undefined;const fs=process.getBuiltinModule('node:fs');const path=process.getBuiltinModule('node:path');const live=home+'/profiles/.generations/live';let gens=[];try{gens=fs.readdirSync(live).filter((n)=>n.startsWith('dsh-forge+forge+')).sort()}catch(e2){return undefined}const latest=gens.at(-1);return latest===undefined?undefined:path.join(live,latest,'node_modules/@dsh-forge/task-loop/skills')}})()
                - !!js (()=>{try{return process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('@dsh-forge/expert-squad/package.json')),'skills')}catch(e){const home=process.env.DSH_HOME;if(!home)return undefined;const fs=process.getBuiltinModule('node:fs');const path=process.getBuiltinModule('node:path');const live=home+'/profiles/.generations/live';let gens=[];try{gens=fs.readdirSync(live).filter((n)=>n.startsWith('dsh-forge+forge+')).sort()}catch(e2){return undefined}const latest=gens.at(-1);return latest===undefined?undefined:path.join(live,latest,'node_modules/@dsh-forge/expert-squad/skills')}})()
                - !!js (()=>{try{return process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('@dsh-forge/knowledge/package.json')),'skills')}catch(e){const home=process.env.DSH_HOME;if(!home)return undefined;const fs=process.getBuiltinModule('node:fs');const path=process.getBuiltinModule('node:path');const live=home+'/profiles/.generations/live';let gens=[];try{gens=fs.readdirSync(live).filter((n)=>n.startsWith('dsh-forge+forge+')).sort()}catch(e2){return undefined}const latest=gens.at(-1);return latest===undefined?undefined:path.join(live,latest,'node_modules/@dsh-forge/knowledge/skills')}})()
- insert:
    - id: preset-headhunter
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: headhunter
        name: 猎头模式
        description: '专家团猎头：对话式招聘与管理专家档案（招募/修改/启停/查询），不含委派。'
        order: 3
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                You are a coding agent powered by the {{model}} model.
                你是专家团猎头（猎头模式）：寻访与管理专家人才的负责人。核心能力是「看人」——把一句模糊的用人需求，澄清成一份可直接差遣的专家档案：键名、岗位头衔、简介、工具装备、人设履历，一次交付即可派发。
                猎头作风：先澄清岗位画像再寻访——问清三件事（要解决什么问题、需要哪些工具装备、档案放用户层还是项目层），需求不明不动笔；list_experts 查重防撞名，有人岗匹配的先给对标建议，市场无人再启动建档；档案落盘后带键名与落点回执，提示用户在专家团面板查看。
                简历官视角：每份专家档案都是一份简历——title 是岗位头衔，description 是一句话卖点，persona 是履历正文，tools 是技能装备；写出来的档案要让用户看简历就能决定是否差遣。
                用人部门对齐：用户是老板，主 agent 是用人部门——猎头向用人部门交付：档案合格与否，由用人部门能否拿去直接差遣说了算；岗位画像以用人部门诉求为准绳，宁可多问一轮，不交付岗位错配的档案。
                边界（猎头只荐不管派）：委派执行是主会话对专家说任务的事，猎头不代派；会话不产出代码、不执行命令、不改仓库文件，档案落盘一律走专家管理工具；不编造履历与能力，不擅自扩写工具白名单。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: tool-plugin-market
            name: '@deepseek-ai/dsh-plugin-market/tools'
            disabled: true
          - id: skill-office # agent 侧技能提供方（office-docx/pptx/xlsx）
            name: '@deepseek-ai/dsh-skill-office'
            disabled: true
          - id: office-to-pdf # host 侧 Office→PDF 转换提供方（连带文档预览转换面）
            name: '@deepseek-ai/dsh-office-to-pdf'
            disabled: true
          - id: skill-filesystem-expert-squad
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              providerName: filesystem-expert-squad
              customSkillDirs:
                - !!js (()=>{try{return process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('@dsh-forge/expert-squad/package.json')),'skills')}catch(e){const home=process.env.DSH_HOME;if(!home)return undefined;const fs=process.getBuiltinModule('node:fs');const path=process.getBuiltinModule('node:path');const live=home+'/profiles/.generations/live';let gens=[];try{gens=fs.readdirSync(live).filter((n)=>n.startsWith('dsh-forge+forge+')).sort()}catch(e2){return undefined}const latest=gens.at(-1);return latest===undefined?undefined:path.join(live,latest,'node_modules/@dsh-forge/expert-squad/skills')}})()
