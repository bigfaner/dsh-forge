<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>会话视图(上游继承)— dsh-forge M3</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <!-- 壳级 slim rail:会话 = 当前视图(M3:subagent 执行与跳转目标) -->
    <aside class="rail" aria-label="主视图切换">
      <button class="rail-btn is-active" type="button" aria-label="会话" title="会话" aria-current="location">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M21 12a8 8 0 0 1-8 8H5l-2 2V12a8 8 0 0 1 8-8h2a8 8 0 0 1 8 8Z"/></svg>
      </button>
      <button class="rail-btn" type="button" aria-label="工作台" title="工作台" onclick="location.href='overview.html'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="10" y="4" width="5" height="10" rx="1.5"/><rect x="17" y="4" width="4" height="13" rx="1.5"/></svg>
      </button>
    </aside>

    <div class="main">
      <header class="topbar">
        <span class="t-14" style="font-weight: 500;">会话视图</span>
        <span class="pill outline">上游 GUI · 100% 继承</span>
        <div class="topbar-spacer"></div>
        <button class="btn sm ghost" type="button" data-theme-toggle>主题</button>
      </header>

      <main class="content">
        <div class="card state-card">
          <div class="t-16" style="margin-bottom: 4px;">subagent 执行会话(定位占位)</div>
          <p class="t-14 t-secondary hint">
            上游 dsh 会话界面,不在 M3 设计范围(TECH-ui-reuse-001)。<br>
            UF1「进入会话」= 切换到本视图 + session-focus 定位 subagent 执行会话(如 <span class="t-mono t-12">#c41e · T2.2 systemPrompt 预合成</span>);<br>
            返回 = M1 既有视图切换契约(顶栏切换),不新增返回面;审批操作不在此视图呈现(上游零侵入,显式裁决)。
          </p>
          <button class="btn primary" type="button" onclick="location.href='tasks.html'">返回任务看板</button>
        </div>
      </main>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
